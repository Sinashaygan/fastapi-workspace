version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres_data/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "5433:5432"


  redis:
    image: docker.arvancloud.ir/library/redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  smtp4dev:
    image: docker.arvancloud.ir/rnwood/smtp4dev:v3
    container_name: smtp4dev
    restart: always
    ports:
      - "5000:80"   # پورت پنل وب
      - "2525:25"     # پورت سرور SMTP برای ارسال ایمیل
      - "143:143"   # پورت IMAP
    volumes:
      - smtp4dev-data:/smtp4dev

  locust:
    image: docker.arvancloud.ir/locustio/locust
    container_name: locust
    ports:
      - "8089:8089"
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "8000:8000"
    command: bash -c 'fastapi dev --host 0.0.0.0 --port 8000'
    volumes:
      - ./core:/usr/src/core
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      JWT_SECRET_KEY: r-0g92-fdv2q57i8zebj(_d)6oxudr)@^shq(a)*3+us%tr313 
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: celery_worker
    command: bash -c 'celery -A core.celery_conf:celery_app worker --loglevel=info'
    volumes:
      - ./core:/usr/src/core
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      JWT_SECRET_KEY: r-0g92-fdv2q57i8zebj(_d)6oxudr)@^shq(a)*3+us%tr313 
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: celery_beat
    command: bash -c 'celery -A core.celery_conf:celery_app beat --loglevel=info'
    volumes:
      - ./core:/usr/src/core
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      JWT_SECRET_KEY: r-0g92-fdv2q57i8zebj(_d)6oxudr)@^shq(a)*3+us%tr313 
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: docker.arvancloud.ir/mher/flower:0.9.7
    command: ['flower', '--broker=redis://redis:6379/3', '--port=5555']
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis


volumes:
  postgres_data:
  smtp4dev-data: